<script>
  (() => {
    const SELECTOR = '.home-header-menu a';
    const CONTENT_SELECTOR = '.content';

    function isModifiedClick(event) {
      return event.metaKey || event.ctrlKey || event.shiftKey || event.altKey || event.button !== 0;
    }

    function shouldIntercept(anchor) {
      if (!anchor) return false;
      if (anchor.target && anchor.target !== '_self') return false;
      if (anchor.hasAttribute('download')) return false;

      const url = new URL(anchor.href, window.location.origin);
      return url.origin === window.location.origin;
    }

    async function swapPage(url, pushState) {
      const response = await fetch(url, {
        headers: {
          'X-Requested-With': 'page-transition'
        }
      });

      if (!response.ok) {
        throw new Error(`Navigation failed: ${response.status}`);
      }

      const html = await response.text();
      const doc = new DOMParser().parseFromString(html, 'text/html');
      const nextContent = doc.querySelector(CONTENT_SELECTOR);
      const currentContent = document.querySelector(CONTENT_SELECTOR);

      if (!nextContent || !currentContent) {
        window.location.href = url;
        return;
      }

      const applySwap = () => {
        currentContent.innerHTML = nextContent.innerHTML;
        document.title = doc.title;
        document.documentElement.lang = doc.documentElement.lang || document.documentElement.lang;
        window.scrollTo({ top: 0, left: 0, behavior: 'auto' });
      };

      if (document.startViewTransition) {
        document.startViewTransition(applySwap);
      } else {
        applySwap();
      }

      if (pushState) {
        window.history.pushState({}, '', url);
      }
    }

    document.addEventListener('click', async (event) => {
      const anchor = event.target.closest(SELECTOR);
      if (!anchor || isModifiedClick(event) || !shouldIntercept(anchor)) {
        return;
      }

      event.preventDefault();

      try {
        await swapPage(anchor.href, true);
      } catch (error) {
        window.location.href = anchor.href;
      }
    });

    window.addEventListener('popstate', async () => {
      try {
        await swapPage(window.location.href, false);
      } catch (error) {
        window.location.reload();
      }
    });

    window.backToTop = function backToTop() {
      window.scrollTo({ top: 0, left: 0, behavior: 'smooth' });
    };
  })();
</script>
